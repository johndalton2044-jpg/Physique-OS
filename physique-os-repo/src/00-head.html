<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Physique">
<meta name="description" content="Offline-first adaptive body-composition operating system.">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Physique OS</title>
<!-- EXTERNAL-NETWORK CLASSIFICATION — the ONLY external URL in this file.
     OPTIONAL, NON-CORE, OPT-IN, INERT BY DEFAULT. It lives inside a <template>, which the browser never
     fetches. Nothing requests it unless the user runs "Enable web fonts" from Settings; the type stack
     resolves to Georgia / system-ui / Menlo without it. The offline self-test disables fetch and the
     app boots, renders and saves with zero network calls. -->
<style>
/*__FONT_FACES__*/

/* ============================================================================
   REGION: TOKENS — the single source of truth for the visual system.
   Semantic names are mandatory in components: --good/--attention/--negative/--inferred/--neutral.
   Lavender (--inferred) is reserved for modelled / predicted / estimated values. Never decorative.
   Every text size derives from --ts (global type scale); --pad/--gap derive from --density.
   ============================================================================ */
:root{
  --bg:#101216;--surface:#181b20;--surface-2:#1f242a;--surface-3:#272d34;
  --border:rgba(180,200,210,0.09);--border-strong:rgba(180,200,210,0.16);
  --text:#e4e7e4;--text-2:#969d9c;--text-3:#8a9291;
  --good:#7d9b6a;--attention:#d2a86f;--negative:#c47b67;--inferred:#9b8db3;--neutral:#6f93a8;
  --accent:#8fbc8f;--on-accent:#0f1310;
  --good-bg:rgba(125,155,106,.10);--attention-bg:rgba(210,168,111,.10);--negative-bg:rgba(196,123,103,.10);--inferred-bg:rgba(155,141,179,.12);--neutral-bg:rgba(111,147,168,.10);
  --display:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --lh:1.55;--ls:0em;--fw:400;
  --radius:14px;--radius-sm:8px;--radius-xs:5px;
  --ts:1;--density:1;
  --pad:calc(16px*var(--density));--gap:calc(10px*var(--density));
  --shadow:none;--shadow-lg:0 12px 40px rgba(0,0,0,.45);
  --focus:0 0 0 3px rgba(143,188,143,.45);
  --motion:1;
}
html[data-contrast="high"]{--text:#f4f6f4;--text-2:#c1c8c7;--text-3:#a2aaa9;--border:rgba(200,220,230,.22);--border-strong:rgba(200,220,230,.38);--good:#9ac387;--attention:#e6bd7d;--negative:#e08f79;--inferred:#b8a9d6;--neutral:#8fb4cc;--focus:0 0 0 3px rgba(230,189,125,.7)}
html[data-motion="reduced"]{--motion:0}
html[data-models="hide"] .cls-mark,html[data-models="hide"] .m-prov .cls{display:none}
html[data-motion="reduced"] *,html[data-motion="reduced"] *::before,html[data-motion="reduced"] *::after{transition-duration:0s!important;animation-duration:0s!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:0s!important;animation-duration:0s!important}}
html[data-density="compact"]{--density:.8}
html[data-density="comfortable"]{--density:1.22}
@media(prefers-reduced-motion:reduce){:root{--motion:0}}

/* REGION: BASE */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html[data-motion="reduced"]{scroll-behavior:auto}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:calc(15px*var(--ts));line-height:var(--lh);letter-spacing:var(--ls);font-weight:var(--fw);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);min-height:100vh}
::selection{background:var(--attention);color:var(--on-accent)}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:none;box-shadow:var(--focus)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
html[data-shape=editorial]{--radius:6px;--radius-sm:5px;--radius-xs:3px}
html[data-shape=industrial]{--radius:6px;--radius-sm:4px;--radius-xs:3px}
html[data-shape=glass]{--surface:color-mix(in srgb,var(--surface) 88%,transparent);--surface-2:color-mix(in srgb,var(--surface-2) 86%,transparent);--shadow-lg:0 12px 32px rgba(0,0,0,.28)}

/* REGION: HEADER + NAV */
header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:100;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.header-inner{padding:12px calc(18px + env(safe-area-inset-right,0px)) 0 calc(18px + env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
/* Wraps: at a wide face or large text the actions drop to their own row instead of pushing the page sideways. */
.header-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px;margin-bottom:8px}
/* The name shrinks first, down to 140 px; only when the actions still cannot fit beside it do they wrap. A 180 px basis
   wrapped the header even at default settings, making it 22 px taller on an ordinary phone. */
.header-top>div:first-child{min-width:140px;flex:1 1 0}
.brand{font-family:var(--display);font-weight:500;font-size:calc(21px*var(--ts));letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.brand-mark{color:var(--inferred)}
.context-line{font-family:var(--mono);font-size:calc(10.5px*var(--ts));color:var(--text-2);letter-spacing:.03em;margin-top:3px;line-height:1.4}
.context-line strong{color:var(--text);font-weight:500}
.context-line .demo-flag{color:var(--attention)}
.header-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:0 1 auto;margin-left:auto}
.hdr-btn{background:var(--surface-2);border:1px solid var(--border-strong);color:var(--text-2);font-family:var(--mono);font-size:calc(10.5px*var(--ts));letter-spacing:.04em;padding:7px 11px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.hdr-btn:hover{color:var(--text);border-color:var(--text-3)}
.hdr-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--good);display:inline-block}
.hdr-btn .dot.stale{background:var(--negative)}
nav.primary{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;-webkit-overflow-scrolling:touch}
nav.primary::-webkit-scrollbar{display:none}
.tab{background:none;border:1px solid transparent;color:var(--text-3);font-size:calc(13px*var(--ts));font-weight:500;padding:8px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:44px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--text);background:var(--surface-2);border-color:var(--border-strong)}
.tab .badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:5px;border-radius:999px;font-family:var(--mono);font-size:calc(9px*var(--ts));background:var(--attention);color:var(--on-accent);line-height:16px;vertical-align:middle}

/* REGION: LAYOUT */
main{max-width:720px;margin:0 auto;padding:18px 18px 150px}
@media(min-width:1024px){.header-inner{max-width:1040px}main{max-width:1040px;padding:24px 32px 150px}}
@media(min-width:1500px){.header-inner{max-width:1180px}main{max-width:1180px}}
.view{display:none}
.view.active{display:block}
.two-col{display:grid;grid-template-columns:1fr;gap:var(--gap)}
@media(min-width:768px){.two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.stack>*+*{margin-top:var(--gap)}

/* REGION: TYPOGRAPHY */
h2{font-family:var(--display);font-size:calc(27px*var(--ts));font-weight:500;letter-spacing:-.025em;line-height:1.15;margin-bottom:4px}
h2 .eyebrow{display:block;font-family:var(--mono);font-size:calc(10px*var(--ts));font-weight:500;letter-spacing:.06em;color:var(--text-3);margin-bottom:6px}
h3{font-family:var(--display);font-size:calc(17.5px*var(--ts));font-weight:500;letter-spacing:-.015em;margin:22px 0 10px}
h3.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h3.section-h .count{font-family:var(--mono);font-size:calc(10px*var(--ts));color:var(--text-3);letter-spacing:.04em;font-weight:400}
.subtitle{color:var(--text-2);font-size:calc(13.5px*var(--ts));margin-bottom:18px;line-height:1.5}
.lead{font-size:calc(14px*var(--ts));color:var(--text-2);line-height:1.6}
.muted{color:var(--text-3)}
.mono{font-family:var(--mono)}
p+p{margin-top:8px}

/* REGION: CARDS + ROWS (the two primitives that do most of the work) */
.card{background:var(--surface);border:var(--card-border-width,1px) solid var(--border);border-radius:var(--radius);padding:var(--card-pad,var(--pad));margin-bottom:var(--gap);box-shadow:var(--card-shadow,none)}
.card.flush{padding:0;overflow:hidden}
.card.accent-good{border-left:3px solid var(--card-semantic-color,var(--good))}
.card.accent-attention{border-left:3px solid var(--card-semantic-color,var(--attention))}
.card.accent-negative{border-left:3px solid var(--card-semantic-color,var(--negative))}
.card.accent-inferred{border-left:3px solid var(--card-semantic-color,var(--inferred))}
.card.accent-neutral{border-left:3px solid var(--card-semantic-color,var(--neutral))}
.card-title{font-family:var(--display);font-size:calc(15.5px*var(--ts));font-weight:500;letter-spacing:-.01em;line-height:1.3}
.card-sub{font-size:calc(11.5px*var(--ts));color:var(--text-3);margin-top:2px;line-height:1.45}
.card-head{margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row.tight{padding:4px 0}
.row .l{font-size:calc(12.5px*var(--ts));color:var(--text);min-width:0}
.row .l small{display:block;font-size:calc(10.5px*var(--ts));color:var(--text-3);line-height:1.35;margin-top:1px}
.row .r{font-family:var(--mono);font-size:calc(11.5px*var(--ts));color:var(--text-2);text-align:right;flex:none;max-width:52%}
.row .r strong{color:var(--text);font-weight:500}
.row .r small{display:block;font-size:calc(9.5px*var(--ts));color:var(--text-3);margin-top:1px;font-family:var(--mono)}
.row .r.good{color:var(--good)}.row .r.attention{color:var(--attention)}.row .r.negative{color:var(--negative)}.row .r.inferred{color:var(--inferred)}.row .r.neutral{color:var(--neutral)}

/* REGION: METRIC TILES — value + provenance + age, always */
.vitals{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);margin:14px 0}
@media(min-width:768px){.vitals{grid-template-columns:repeat(4,minmax(0,1fr))}}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px;min-width:0}
.metric .m-label{font-size:calc(11px*var(--ts));color:var(--text-2);line-height:1.3;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.metric .m-value{font-family:var(--display);font-size:calc(24px*var(--ts));font-weight:500;letter-spacing:-.02em;line-height:1.1;margin:5px 0 4px;color:var(--text);word-break:break-word}
.metric .m-value .unit{font-size:calc(12px*var(--ts));color:var(--text-2);font-family:var(--body);font-weight:400;margin-left:3px;letter-spacing:0}
.metric.inferred .m-value{color:var(--inferred)}
.metric.stale .m-value{color:var(--text-2)}
.metric .m-prov{font-family:var(--mono);font-size:calc(9.5px*var(--ts));color:var(--text-3);line-height:1.4;letter-spacing:.02em}
.metric .m-prov .age-aging{color:var(--attention)}
.metric .m-prov .age-stale{color:var(--negative)}
.metric .m-prov .cls{color:var(--inferred)}
.metric .m-prov .cls.measured{color:var(--text-3)}
.metric .m-prov .cls.derived{color:var(--neutral)}
.metric.empty .m-value{color:var(--text-3);font-size:calc(14px*var(--ts));font-family:var(--body);font-weight:400}
/* Data-state visual language is structural, not colour-only. The governance layer supplies the pattern token;
   these selectors make that token visible on the common metric surface. Theme colours remain token-driven. */
.metric[data-state-pattern="dashed"]{border-style:dashed}
.metric[data-state-pattern="double"]{border-style:double}
.metric[data-state-pattern="strike"] .m-value{text-decoration:line-through;text-decoration-thickness:1px}
.metric[data-state-pattern="faded"]{opacity:.72}
.metric[data-state-pattern="empty"]{border-style:dashed}
.metric[data-state-pattern="crosshatch"]{background-image:repeating-linear-gradient(135deg,transparent 0,transparent 7px,var(--border) 8px,transparent 9px)}

/* class marks: the epistemic mark travels with every number */
.cls-mark{display:inline-block;font-family:var(--mono);font-size:calc(9px*var(--ts));letter-spacing:.04em;padding:1px 6px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-3);line-height:1.5;vertical-align:middle}
.cls-mark.measured{color:var(--text-2)}
.cls-mark.derived{color:var(--neutral);border-color:rgba(111,147,168,.4)}
.cls-mark.heuristic,.cls-mark.prior{color:var(--attention);border-color:rgba(210,168,111,.4)}
.cls-mark.empirical,.cls-mark.calibrated,.cls-mark.predictive,.cls-mark.inferred{color:var(--inferred);border-color:rgba(155,141,179,.5);background:var(--inferred-bg)}
.cls-mark.reference{color:var(--neutral)}
.pill{display:inline-block;font-family:var(--mono);font-size:calc(9.5px*var(--ts));letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);line-height:1.6;white-space:nowrap;max-width:100%;white-space:normal;overflow-wrap:anywhere;text-align:center}
.pill.good{color:var(--good);border-color:rgba(125,155,106,.45);background:var(--good-bg)}
.pill.attention{color:var(--attention);border-color:rgba(210,168,111,.45);background:var(--attention-bg)}
.pill.negative{color:var(--negative);border-color:rgba(196,123,103,.45);background:var(--negative-bg)}
.pill.inferred{color:var(--inferred);border-color:rgba(155,141,179,.5);background:var(--inferred-bg)}
.pill.neutral{color:var(--neutral);border-color:rgba(111,147,168,.45);background:var(--neutral-bg)}
.prov{font-family:var(--mono);font-size:calc(10px*var(--ts));color:var(--text-3);letter-spacing:.02em;line-height:1.45}
.prov .age-aging{color:var(--attention)}.prov .age-stale{color:var(--negative)}

/* REGION: DECISION CARD — the highest-priority UI object; spend the boldness here */
.decision{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:calc(var(--pad)*1.15) var(--pad);margin:12px 0 var(--gap);position:relative;overflow:hidden}
.decision::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dcol,var(--neutral))}
.decision .d-eyebrow{font-family:var(--mono);font-size:calc(10px*var(--ts));color:var(--text-3);letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.decision .d-verb{font-family:var(--display);font-size:calc(34px*var(--ts));font-weight:500;letter-spacing:-.03em;line-height:1.05;margin:8px 0 6px;color:var(--text)}
.decision .d-verb.insufficient{color:var(--text-2)}
.decision .d-lede{font-size:calc(14px*var(--ts));color:var(--text-2);line-height:1.55;max-width:60ch}
.decision .d-block{margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
.decision .d-block-title{font-size:calc(11px*var(--ts));color:var(--text-3);margin-bottom:5px;font-family:var(--mono);letter-spacing:.04em}
.decision ul{list-style:none}
.decision li{font-size:calc(13px*var(--ts));color:var(--text);padding:3px 0 3px 14px;position:relative;line-height:1.45}
.decision li::before{content:'';position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--text-3)}
.decision li.good::before{background:var(--good)}.decision li.attention::before{background:var(--attention)}.decision li.negative::before{background:var(--negative)}.decision li.inferred::before{background:var(--inferred)}
.decision .d-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.decision .d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* REGION: ATTENTION / WATCH LIST */
.watch{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--neutral);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px}
.watch.critical{border-left-color:var(--negative);background:var(--negative-bg)}
.watch.high{border-left-color:var(--negative)}
.watch.moderate{border-left-color:var(--attention)}
.watch.low{border-left-color:var(--neutral)}
.watch.info{border-left-color:var(--border-strong)}
.watch .w-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.watch .w-title{font-size:calc(13.5px*var(--ts));font-weight:500;color:var(--text);line-height:1.35}
.watch .w-sev{font-family:var(--mono);font-size:calc(9.5px*var(--ts));letter-spacing:.05em;color:var(--text-3);flex:none}
.watch .w-body{font-size:calc(12px*var(--ts));color:var(--text-2);margin-top:4px;line-height:1.5}
.watch .w-body b{color:var(--text);font-weight:500}
.watch .w-foot{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* REGION: PROGRESSIVE DISCLOSURE — folds must carry a signal in their summary */
details.fold{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:var(--gap);overflow:hidden}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;user-select:none;min-height:44px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary .f-title{font-family:var(--display);font-size:calc(15px*var(--ts));color:var(--text);flex:0 1 auto;min-width:0;overflow-wrap:anywhere}
details.fold>summary .f-signal{font-size:calc(11px*var(--ts));color:var(--text-2);flex:1 1 140px;min-width:0;overflow-wrap:anywhere;line-height:1.35;font-family:var(--mono)}
details.fold>summary .f-signal.attention{color:var(--attention)}details.fold>summary .f-signal.negative{color:var(--negative)}details.fold>summary .f-signal.good{color:var(--good)}details.fold>summary .f-signal.inferred{color:var(--inferred)}
details.fold>summary .f-chev{color:var(--text-3);transition:transform calc(.18s*var(--motion));flex:none;font-size:calc(14px*var(--ts))}
details.fold[open]>summary .f-chev{transform:rotate(90deg)}
details.fold[open]>summary{border-bottom:1px solid var(--border)}
details.fold>.f-body{padding:6px 14px 14px}
details.fold.urgent>summary .f-title{color:var(--negative)}
details.fold .card{background:transparent;border:none;padding:0;margin:0}

/* REGION: FORMS + SHEETS */
.form-row{margin-bottom:11px}
.form-row label{display:block;font-size:calc(11.5px*var(--ts));color:var(--text-2);margin-bottom:4px}
.form-row label small{color:var(--text-3)}
.form-row input,.form-row select,.form-row textarea{width:100%;min-width:0;max-width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 12px;border-radius:var(--radius-sm);font-size:calc(15px*var(--ts));outline:none;font-family:var(--body);min-height:44px}
.form-row input[type=number],.form-row input[type=date],.form-row input[inputmode]{font-family:var(--mono)}
.form-row textarea{resize:vertical;min-height:64px}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--accent);box-shadow:var(--focus)}
.form-row .hint{font-size:calc(10.5px*var(--ts));color:var(--text-3);margin-top:4px;line-height:1.4}
.form-row .hint.warn{color:var(--attention)}
.form-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.form-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:999px;padding:8px 13px;font-size:calc(12.5px*var(--ts));cursor:pointer;min-height:44px;white-space:nowrap}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.active{background:var(--surface-3);color:var(--text);border-color:var(--text-3)}
.chip.sm{padding:5px 10px;min-height:44px;font-size:calc(11.5px*var(--ts))}
.scale-row{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.scale-row button{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);border-radius:var(--radius-xs);min-height:44px;font-family:var(--mono);font-size:calc(12px*var(--ts));cursor:pointer;padding:0}
.scale-row button.active{background:var(--surface-3);color:var(--text);border-color:var(--text-3)}
.sheet-backdrop{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1000;display:none;align-items:flex-end;justify-content:center}
.sheet-backdrop.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border);border-bottom:none;box-shadow:var(--shadow-lg)}
@media(min-width:768px){.sheet-backdrop{align-items:center;padding:20px}.sheet{border-radius:var(--radius);border-bottom:1px solid var(--border);max-height:86vh}}
.sheet-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-title{font-family:var(--display);font-size:calc(19px*var(--ts));font-weight:500;letter-spacing:-.02em;line-height:1.2}
.sheet-desc{font-size:calc(12px*var(--ts));color:var(--text-3);margin-top:3px;line-height:1.4}
.sheet-close{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);width:36px;height:36px;border-radius:50%;cursor:pointer;font-family:var(--mono);display:flex;align-items:center;justify-content:center;flex:none}
.sheet-body{padding:16px 18px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;gap:8px;background:var(--surface)}
.sheet-foot .btn{flex:1}

/* REGION: BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);font-size:calc(13.5px*var(--ts));font-weight:500;cursor:pointer;border:1px solid transparent;min-height:44px;line-height:1.2;text-decoration:none}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-secondary{background:var(--surface-2);color:var(--text-2);border-color:var(--border-strong)}
.btn-secondary:hover{color:var(--text)}
.btn-ghost{background:transparent;color:var(--text-2);border-color:transparent;padding:8px 10px;min-height:44px}
.btn-ghost:hover{color:var(--text);background:var(--surface-2)}
.btn-danger{background:transparent;color:var(--negative);border-color:rgba(196,123,103,.35)}
.btn-danger:hover{background:var(--negative-bg)}
.btn-sm{padding:6px 11px;min-height:44px;font-size:calc(12px*var(--ts))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.link{background:none;border:none;color:var(--neutral);cursor:pointer;font-size:inherit;padding:0;text-decoration:underline;text-underline-offset:2px}

/* REGION: FAB + floating controls — never overlap nav, sheets or the keyboard */
.fab{min-height:44px;position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:60;width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent);font-size:calc(26px*var(--ts));font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
/* ONE source of visibility: the `hidden` attribute. This previously defaulted to display:none and relied on
   a `.show` class that nothing ever added, so every button in the utility rail was invisible — including
   the command and undo buttons. The attribute is also what assistive technology reads, so keeping the two in
   step means a control cannot be visually present but semantically absent, or the reverse. */
.fab-mini{position:fixed;right:calc(24px + env(safe-area-inset-right,0px));z-index:60;width:44px;height:44px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-2);font-family:var(--mono);font-size:calc(12px*var(--ts));cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fab-mini[hidden]{display:none}
.fab-mini.show{display:flex}   /* retained: harmless, and older markup may still set it */
#undoFab{bottom:calc(90px + env(safe-area-inset-bottom,0px))}
/* per-button offsets are gone: the rails position their children */
body.sheet-open .fab,body.sheet-open .rail-right,body.sheet-open .rail-left{opacity:0;pointer-events:none}
@media print{.fab,.fab-mini,header,nav{display:none!important}}

/* REGION: COMMAND PALETTE */
.cmdk-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1100;display:none;align-items:flex-start;justify-content:center;padding:calc(12vh + env(safe-area-inset-top,0px)) 14px 14px}
.cmdk-backdrop.show{display:flex}
.cmdk{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg)}
.cmdk input{width:100%;background:var(--surface-2);border:none;border-bottom:1px solid var(--border);color:var(--text);padding:14px 16px;font-size:calc(15px*var(--ts));font-family:var(--body);outline:none;min-height:48px}
.cmdk-results{max-height:50vh;overflow-y:auto}
.cmdk-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 16px;cursor:pointer;border-left:2px solid transparent;min-height:44px}
.cmdk-item.sel{background:var(--surface-2);border-left-color:var(--accent)}
.cmdk-item .ci-label{font-size:calc(13.5px*var(--ts));color:var(--text)}
.cmdk-item .ci-hint{font-family:var(--mono);font-size:calc(10px*var(--ts));color:var(--text-3);text-align:right;flex:none}
.cmdk-item .ci-desc{display:block;font-size:calc(11.5px*var(--ts));color:var(--text-3);line-height:1.35;margin-top:1px}
.cmdk-item .ci-why{display:block;font-size:calc(11px*var(--ts));color:var(--attention);margin-top:1px}
.cmdk-empty{padding:14px 16px;color:var(--text-3);font-size:calc(13px*var(--ts))}

/* REGION: TOAST + BANNERS */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);max-width:92%;background:var(--surface-3);color:var(--text);border:1px solid var(--border-strong);font-size:calc(13px*var(--ts));line-height:1.4;padding:11px 14px;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);z-index:2000;opacity:0;pointer-events:none;transition:opacity calc(.22s*var(--motion)),transform calc(.22s*var(--motion));display:flex;gap:10px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast.negative{border-color:rgba(196,123,103,.5)}
.toast .link{color:var(--accent)}
/* NOT a flex container. It was, over raw text, so any inline markup inside the sentence — a <b>, a link —
   became a flex item of its own and the sentence was dealt out into columns: "Demo record loaded: 70 days of
   generated data marked | demo | . Nothing here is yours." Text flows normally now and the action floats to
   the side, which fixes every banner including ones written later, without each call site needing a wrapper. */
.banner{border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:12px;font-size:calc(12.5px*var(--ts));display:flow-root;line-height:1.5;border:1px solid var(--border)}
.banner .btn{float:right;margin:-2px 0 6px 12px}
.banner .banner-text{display:block;overflow-wrap:anywhere}
.banner.attention{background:var(--attention-bg);border-color:rgba(210,168,111,.35);color:var(--attention)}
.banner.negative{background:var(--negative-bg);border-color:rgba(196,123,103,.35);color:var(--negative)}
.banner.neutral{background:var(--neutral-bg);border-color:rgba(111,147,168,.35);color:var(--text-2)}
.banner .btn{flex:none}

/* REGION: CHARTS — observed vs derived vs predicted must be visually distinct */
.chart{width:100%;height:auto;display:block;margin:6px 0 4px}
.chart .obs{fill:var(--text-2)}
.chart .avg{stroke:var(--text);fill:none;stroke-width:1.6}
.chart .trend{stroke:var(--neutral);fill:none;stroke-width:1.2;stroke-dasharray:4 3}
.chart .pred{stroke:var(--inferred);fill:none;stroke-width:1.4;stroke-dasharray:2 3}
.chart .band{fill:var(--inferred);opacity:.12}
.chart [data-series-semantic="predictive"]{stroke-dasharray:6 4}
.chart .bar.predictive,.chart .obs.predictive{opacity:.78}
.chart .band.uncertainty-forecast{opacity:.14}
.chart [data-uncertainty-type="parameter"],.chart [data-uncertainty-type="structural"]{stroke-dasharray:4 3}

.chart .grid{stroke:var(--border);stroke-width:1}
.chart .axis{fill:var(--text-3);font-family:var(--mono);font-size:9px}
.chart .target{stroke:var(--good);stroke-width:1;stroke-dasharray:1 3;fill:none}
.chart .bar{fill:var(--neutral);opacity:.75}
.chart .bar.under{fill:var(--attention)}
.chart .marker{stroke:var(--attention);stroke-width:1;stroke-dasharray:2 2}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:calc(9.5px*var(--ts));color:var(--text-3);margin-bottom:6px}
.legend span::before{content:'';display:inline-block;width:14px;height:0;border-top:2px solid var(--text-2);margin-right:5px;vertical-align:middle}
.legend .lg-obs::before{border-top:0;width:6px;height:6px;border-radius:50%;background:var(--text-2)}
.legend .lg-avg::before{border-color:var(--text)}
.legend .lg-trend::before{border-color:var(--neutral);border-top-style:dashed}
.legend .lg-pred::before{border-color:var(--inferred);border-top-style:dotted}
.legend .lg-target::before{border-color:var(--good);border-top-style:dotted}
.range-pills{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}

/* REGION: LISTS / TABLES / MISC */
.list-item{padding:9px 0;border-bottom:1px solid var(--border)}
.list-item[data-act]{min-height:44px;cursor:pointer}
.trace-chain{margin:10px 0}
.tc-step{display:flex;gap:10px;align-items:stretch}
.tc-rail{flex:none;width:14px;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.tc-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.tc-line{flex:1;width:1px;background:var(--border);margin:3px 0}
.tc-body{flex:1;min-width:0;padding-bottom:12px}
.tc-head{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.tc-name{font-size:calc(11px*var(--ts));font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.tc-value{font-size:calc(14px*var(--ts));color:var(--text-1);margin-top:1px}
.tc-detail{font-size:calc(12px*var(--ts));color:var(--text-2);margin-top:2px;line-height:1.45}
.traceable{cursor:pointer;border-bottom:1px dotted var(--border-strong)}
/* A second, left-hand pile for POSITION only: where am I in this view, and take me home. Keeping it
   separate from the right-hand action rail means a thumb reaching for "top" never lands on "undo". */
.cmdk-item .ci-pin{flex:none;background:none;border:0;color:var(--text-3);font-size:calc(13px*var(--ts));padding:2px 6px;cursor:pointer;min-height:32px}
.cmdk-item .ci-pin.on{color:var(--attention)}
.cmdk-item .ci-pin:hover,.cmdk-item .ci-pin:focus-visible{color:var(--text-1)}
/* Two columns only where there is room AND a pairing worth showing. Below 1024px the mode collapses rather
   than leaving two half-columns with nothing readable in either. */
html[data-layout="split"] .view{max-width:1180px;margin:0 auto}
@media (min-width:1024px){
  html[data-layout="split"] .view.split-capable.active{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
  html[data-layout="split"] .view.split-capable > .split-aside{position:sticky;top:64px}
}
@media (max-width:1023px){html[data-layout="split"] .view.split-capable.active{display:block}}
/* Both rails share one bottom offset, one inset and one z-index. They had 78px against 88px and 40 against
   60, which put the two sides of the screen at visibly different heights. */
.rail-left{position:fixed;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.rail-right{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
/* Floating controls sit ON TOP of the text column, so there must be few of them and they must get out of the
   way while reading. Both rails fade and shrink out of the way during a downward scroll and come back when
   scrolling stops or reverses — the reading direction is the one where they are least wanted. */
.locked{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);padding:12px 14px;margin:10px 0;background:var(--surface-2)}
.lk-head{display:flex;align-items:center;gap:8px;font-size:calc(13.5px*var(--ts));color:var(--text-1)}
.lk-tag{font-family:var(--mono);font-size:calc(9.5px*var(--ts));letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);border:1px solid var(--border);border-radius:3px;padding:1px 5px}
.lk-need{margin:6px 0 0 0;padding-left:18px}
.lk-need li{font-size:calc(12.5px*var(--ts));color:var(--text-2);line-height:1.5}
.lk-why{font-size:calc(12px*var(--ts));color:var(--text-3);margin-top:6px;line-height:1.5}
.hdr-btn.attn-btn{display:inline-flex;align-items:center;gap:6px;border-color:var(--attention);color:var(--attention)}
.hdr-btn.attn-btn[hidden]{display:none}
.attn-dot{width:7px;height:7px;border-radius:50%;background:var(--attention);flex:none}
.rail-left,.rail-right{transition:opacity .18s ease, transform .18s ease}
html[data-scrolling="down"] .rail-left,html[data-scrolling="down"] .rail-right{opacity:0;pointer-events:none;transform:translateY(8px)}
html[data-scrolling="down"] .fab{opacity:.35}
@media (prefers-reduced-motion:reduce){.rail-left,.rail-right{transition:none}}
.rail-left .fab-mini,.rail-right .fab-mini{position:static;right:auto;bottom:auto;width:44px;height:44px}
.rail-left .fab-mini[hidden],.rail-right .fab-mini[hidden]{display:none}
@media (max-width:360px){.rail-right{right:8px}}
html[data-focus="on"] .rail-left{opacity:.5}
@media (max-width:360px){.rail-left{left:8px}}
.replay-banner{position:sticky;top:0;z-index:59;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--inferred);color:var(--bg);font-size:calc(12px*var(--ts));line-height:1.4}
.replay-banner .rb-tag{font-family:var(--mono);font-size:calc(10px*var(--ts));letter-spacing:.1em;font-weight:700;padding:2px 6px;border:1px solid currentColor;border-radius:3px}
.replay-banner .rb-text{flex:1;min-width:160px}
.replay-banner .rb-controls{display:flex;gap:4px;flex-wrap:wrap}
.replay-banner .btn{background:rgba(0,0,0,.14);border-color:rgba(0,0,0,.3);color:var(--bg)}
.replay-banner .btn[disabled]{opacity:.4}
/* While replaying, every view is visibly not-today. Reading historical output as current advice is the one
   serious hazard of this feature, so the treatment is deliberately hard to overlook. */
html[data-replay="on"] .view{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--inferred) 55%,transparent)}
/* Replay hides the ACTION rail — logging into the past is not what it does — but keeps the left-hand
   position rail, because moving around a replayed day is exactly what you are there to do. */
/* Replay hides the quick-log button — logging into the past is not what it does — and keeps both rails,
   because moving around a replayed day is exactly what you are there to do. */
html[data-replay="on"] .fab{display:none}
.health-banner{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px 12px;background:var(--negative);color:#fff;font-size:calc(12.5px*var(--ts));line-height:1.4}
.health-banner .hb-text{flex:1;min-width:180px}
.health-banner .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.sel-bar{position:sticky;top:52px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;margin-bottom:8px;background:var(--surface-2);border:1px solid var(--accent);border-radius:var(--radius-sm)}
.sb-count{font-family:var(--mono);font-size:calc(11.5px*var(--ts));color:var(--accent);margin-right:4px}
.selbox{width:20px;height:20px;min-height:20px;margin-right:8px;padding:0;flex:none;border:1.5px solid var(--border-strong);border-radius:4px;background:transparent;cursor:pointer;vertical-align:middle}
.selbox.on{background:var(--accent);border-color:var(--accent);position:relative}
.selbox.on::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
.list-item.selectable{padding-left:2px}
.day-nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.day-nav::-webkit-scrollbar{display:none}
.day-nav .btn{flex:none;white-space:nowrap}
.attn-strip{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 11px;border:1px solid var(--attention);border-radius:var(--radius-sm);background:color-mix(in srgb,var(--attention) 8%,transparent);cursor:pointer;min-height:44px}
.as-count{flex:none;font-family:var(--mono);font-size:calc(12px*var(--ts));font-weight:600;color:var(--attention);min-width:18px}
.as-text{flex:1;font-size:calc(12.5px*var(--ts));color:var(--text-1);line-height:1.4}
.as-go{flex:none;font-family:var(--mono);font-size:calc(10.5px*var(--ts));text-transform:uppercase;letter-spacing:.05em;color:var(--attention)}
.tl-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start;min-height:44px}
.tl-row[data-act]{cursor:pointer}
.tl-row[data-act]:hover,.tl-row[data-act]:focus-visible{background:var(--surface-2)}
.tl-when{flex:none;width:58px;font-family:var(--mono);font-size:calc(11px*var(--ts));color:var(--text-3);padding-top:2px}
.tl-what{flex:1;min-width:0}
.tl-kind{font-family:var(--mono);font-size:calc(9.5px*var(--ts));letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.tl-label{font-size:calc(13.5px*var(--ts));color:var(--text-1);line-height:1.4}
.tl-detail{font-size:calc(12px*var(--ts));color:var(--text-2);margin-top:2px;line-height:1.45}
.kbd{display:inline-block;font-family:var(--mono);font-size:calc(11px*var(--ts));padding:2px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface-2);color:var(--text-1);white-space:nowrap}
.flash{animation:flashRow 1.2s ease-out}
@keyframes flashRow{0%{background:color-mix(in srgb,var(--accent) 26%,transparent)}100%{background:transparent}}
#attnFab.urgent{border-color:var(--attention);color:var(--attention)}
/* Focus mode hides secondary detail and diagnostics. It never hides a warning, an uncertainty statement or a
   provenance mark: reducing clutter must not reduce honesty. */
html[data-focus="on"] .fold-secondary,
html[data-focus="on"] details.fold:not(.fold-keep),
html[data-focus="on"] .research-block,
html[data-focus="on"] .tl-detail{display:none}
html[data-focus="on"] .prov{opacity:.55}
.est-block{border:1px dashed var(--inferred);border-radius:var(--radius-sm);padding:12px;margin:8px 0;background:color-mix(in srgb,var(--inferred) 6%,transparent)}
.eb-head{font-size:calc(17px*var(--ts));font-weight:600;color:var(--inferred)}
.eb-qual{font-family:var(--mono);font-size:calc(10.5px*var(--ts));letter-spacing:.05em;color:var(--text-3);margin-top:2px;text-transform:uppercase}
.eb-body{font-size:calc(13px*var(--ts));color:var(--text-2);margin-top:7px;line-height:1.5}
.link{min-height:44px;display:inline-flex;align-items:center}
.list-item:last-child{border-bottom:none}
.list-item .li-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.list-item .li-title{font-size:calc(13px*var(--ts));color:var(--text);font-weight:500}
.list-item .li-meta{font-family:var(--mono);font-size:calc(10px*var(--ts));color:var(--text-3);flex:none;text-align:right}
.list-item .li-body{font-size:calc(12px*var(--ts));color:var(--text-2);margin-top:3px;line-height:1.5}
.list-item .li-actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
table.data{width:100%;border-collapse:collapse;font-size:calc(11.5px*var(--ts))}
table.data th{text-align:left;font-family:var(--mono);font-weight:400;font-size:calc(9.5px*var(--ts));color:var(--text-3);padding:6px 6px 6px 0;border-bottom:1px solid var(--border-strong);letter-spacing:.03em}
table.data td{padding:7px 6px 7px 0;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top}
table.data td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
table.data th.num{text-align:right}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.empty{padding:14px;border:1px dashed var(--border-strong);border-radius:var(--radius-sm);color:var(--text-2);font-size:calc(12.5px*var(--ts));line-height:1.5}
.empty b{color:var(--text);font-weight:500;display:block;margin-bottom:2px}
.empty .btn{margin-top:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:calc(12px*var(--ts))}
.kv dt{color:var(--text-3);font-family:var(--mono);font-size:calc(10.5px*var(--ts))}
.kv dd{color:var(--text-2)}
.divider{height:1px;background:var(--border);margin:14px 0}
.tag{display:inline-block;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-xs);padding:1px 7px;font-size:calc(10.5px*var(--ts));color:var(--text-2);margin:0 4px 4px 0}
.check-list .row .l{display:flex;gap:10px;align-items:center}
.check{width:20px;height:20px;border:1px solid var(--border-strong);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--good);flex:none;background:var(--surface-2)}
.check.done{border-color:var(--good);background:var(--good-bg)}
.set-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.3fr auto;gap:6px;align-items:center;margin-bottom:6px}
.set-grid select{min-height:38px;font-size:calc(12px*var(--ts))}
/* On a phone the six columns stop fitting, so the row wraps into two lines rather than shrinking every
   field until none of them is tappable. */
@media (max-width:520px){
  .set-grid{grid-template-columns:2fr 1fr 1fr;grid-auto-rows:min-content}
  .set-grid > .h:nth-child(n+4){display:none}
  .set-grid select{grid-column:span 2}
}
.set-grid input,.set-grid select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 8px;border-radius:var(--radius-xs);font-size:calc(14px*var(--ts));font-family:var(--mono);min-height:42px;min-width:0}
.set-grid .h{font-family:var(--mono);font-size:calc(9.5px*var(--ts));color:var(--text-3)}
.about-body p{margin-bottom:10px;line-height:1.6;color:var(--text-2);font-size:calc(13.5px*var(--ts))}
.about-body h4{font-family:var(--display);font-size:calc(15px*var(--ts));margin:16px 0 6px;color:var(--text)}
.diag-hyp{padding:8px 0;border-bottom:1px solid var(--border)}
.diag-hyp:last-child{border-bottom:none}
.diag-hyp .dh-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.diag-hyp .dh-title{font-size:calc(13px*var(--ts));color:var(--text);font-weight:500}
.diag-hyp .dh-lik{font-family:var(--mono);font-size:calc(10px*var(--ts));flex:none}
.diag-hyp .dh-body{font-size:calc(11.5px*var(--ts));color:var(--text-2);margin-top:3px;line-height:1.45}
.diag-hyp .dh-body b{color:var(--text-3);font-weight:400;font-family:var(--mono);font-size:calc(10px*var(--ts))}
.sym-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
@media(min-width:768px){.sym-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.progress-bar{height:5px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:4px}
.progress-bar>i{display:block;height:100%;background:var(--neutral);border-radius:999px}
.progress-bar>i.good{background:var(--good)}.progress-bar>i.attention{background:var(--attention)}.progress-bar>i.inferred{background:var(--inferred)}
.trace{font-family:var(--mono);font-size:calc(10.5px*var(--ts));color:var(--text-2);line-height:1.55}
.trace .t-step{padding:4px 0 4px 12px;border-left:2px solid var(--border);margin-left:4px}
.trace .t-step b{color:var(--text-3);font-weight:400}
.trace .t-step.obs{border-left-color:var(--text-3)}.trace .t-step.sig{border-left-color:var(--neutral)}.trace .t-step.mod{border-left-color:var(--inferred)}.trace .t-step.rule{border-left-color:var(--attention)}.trace .t-step.dec{border-left-color:var(--good)}
.food-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;align-items:center;min-height:44px}
.food-item:last-child{border-bottom:none}
.food-item .fi-name{font-size:calc(13px*var(--ts));color:var(--text)}
.food-item .fi-src{font-family:var(--mono);font-size:calc(9.5px*var(--ts));color:var(--text-3);margin-top:1px}
.food-item .fi-kcal{font-family:var(--mono);font-size:calc(11.5px*var(--ts));color:var(--text-2);flex:none}
.meal-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:12px 0 4px}
.meal-head .mh-title{font-family:var(--display);font-size:calc(14.5px*var(--ts));color:var(--text)}
.meal-head .mh-tot{font-family:var(--mono);font-size:calc(10.5px*var(--ts));color:var(--text-3)}
.day-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px 0 8px}
.day-strip::-webkit-scrollbar{display:none}
.day-strip button{flex:none;min-width:52px;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-2);font-family:var(--mono);font-size:calc(10.5px*var(--ts));cursor:pointer;line-height:1.3;min-height:44px}
.day-strip button.active{border-color:var(--text-3);color:var(--text);background:var(--surface-2)}
.day-strip button i{display:block;font-style:normal;font-size:calc(9px*var(--ts));color:var(--text-3)}
.day-strip button i.has{color:var(--good)}
.stale-flag{color:var(--negative)}

/* REGION: MOTION (opt-out via --motion) */
.view.active{animation:fadeIn calc(.2s*var(--motion)) ease}
.sheet-backdrop.show .sheet{animation:slideUp calc(.24s*var(--motion)) ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(max-width:360px){.vitals{gap:6px}.metric{padding:10px}.metric .m-value{font-size:calc(21px*var(--ts))}.decision .d-verb{font-size:calc(29px*var(--ts))}main{padding:14px 12px 150px}.header-inner{padding-left:12px;padding-right:12px}}

/* ---- MEASURED TOUCH TARGETS ----
   A real-browser gate measured every control at five viewport sizes and found several under 44px: the
   header info button at 35 wide, the date steppers at 28, the range buttons at 37. Every one of them had
   "padding" that looked adequate in the stylesheet and was not adequate in pixels. jsdom cannot catch this
   because jsdom does no layout, so for the whole life of this project these were asserted and never
   verified. 44px is the figure both platform guidelines use. */
.hdr-btn,.btn-sm,.seg-btn,[data-act]{min-height:44px}
.hdr-btn{min-width:44px;display:inline-flex;align-items:center;justify-content:center}
/* min-width:44px on a FLEX ITEM replaces the default min-width:auto, and auto is the thing that stops a flex
   item shrinking below its own content. So this rule, added to fix undersized touch targets, silently
   allowed every tab in the tab bar to be squashed to 44px — Progress kept 58px for 65px of text,
   Experiments 69px for 85px — and the labels spilled into each other. The touch-target fix caused a
   layout regression, and the browser gate missed it because it checked clipping and viewport overflow but
   not text overflowing visibly into a sibling. Both are now covered. */
button[data-act],a[data-act]{min-width:44px}
.tab,.tabs [data-act],nav [data-act]{flex-shrink:0;min-width:max-content}
/* Steppers and range pills are narrow by design; widen to the minimum rather than restyling them. */
[data-act="day.step"],[data-act="progress.range"],[data-act="body.range"]{min-width:44px;padding-left:10px;padding-right:10px}
/* An inline control inside a row of text must not force the row taller than its line. */
.row [data-act].btn-ghost{min-height:44px}

/* ---- MEASURED CONTRAST ----
   --text-3 was 4.19:1 against the card surface in a real browser, below the 4.5 that body text needs. The
   token-level audit passed because it checked the pairs it was told to check; the browser measured the
   pairs that actually occur. Lifted until it passes where it is really used. */

/* ---- MEASURED IN A BROWSER, NOT DECLARED ----
   Two defects a real-browser gate found that every token-level audit missed, because the audit checked the
   pairs it was given and the browser measured the pairs that actually occur on screen.

   .lk-tag and .lk-why sit on an elevated card surface (#1f242a), not the base surface the tokens were
   checked against, so their colour resolved to 4.19:1 — below the 4.5 body text needs. Fixed against the
   surface they are really on. */
.lk-tag,.lk-why{color:var(--text-2)}
/* A citation line has no spaces to break on, so it ran 3px past a 393px viewport. Long unbroken source
   names are the normal case here, not the exception. */
.li-meta{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.li-head{min-width:0;flex-wrap:wrap}

/* ---- DASHBOARD ----
   Tiles size from the specification, not from the renderer. A hidden widget is shown faded only while
   editing; outside editing it is not rendered at all. Missing data is a dash in a gap, never a zero. */
.dash-section{margin-bottom:14px}
.dash-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dash-grid.dash-narrow{grid-template-columns:minmax(0,1fr)}
.dash-cell{min-width:0}
.dash-sm{grid-column:span 1}.dash-md{grid-column:span 2}.dash-lg{grid-column:span 4}
.dash-narrow .dash-sm,.dash-narrow .dash-md,.dash-narrow .dash-lg{grid-column:span 1}
.dash-hidden{opacity:.45}
.w-tile{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:12px;padding:10px 12px;min-height:72px}
.w-t{font-size:calc(11px*var(--ts));color:var(--text-2);letter-spacing:.02em}
.w-v{font-size:calc(20px*var(--ts));font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.w-v small{font-size:calc(11px*var(--ts));color:var(--text-2)}
.w-v.w-text{font-size:calc(14px*var(--ts))}
.w-s{font-size:calc(11px*var(--ts));color:var(--text-2);margin-top:2px}
.w-gap{color:var(--text-2)}
.dash-ctl{flex-wrap:wrap}
@media (max-width:519px){.dash-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-lg{grid-column:span 2}}

/* ---- .fld HAD NO RULE ----
   Five sheets wrap inputs in <label class="fld"> and no stylesheet rule matched the class. Measured with the
   rule removed, only TWO sheets actually render undersized inputs (19px tall): the studio, and the label
   scan, which predates the browser gate. The other three are styled by other rules and pass either way.
   An earlier note here claimed all five were broken; the measurement said otherwise, and the measurement
   wins. The label-scan defect was invisible for as long as the gate existed because the gate swept tabs
   and never opened a sheet. */
.fld{display:flex;flex-direction:column;gap:5px;margin:8px 0;min-width:0}
.fld>span{font-size:calc(11px*var(--ts));color:var(--text-2);letter-spacing:.02em}
.fld input,.fld select,.fld textarea{width:100%;min-width:0;max-width:100%;min-height:44px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 12px;
  border-radius:var(--radius-xs,8px);font-size:calc(15px*var(--ts));font-family:inherit;box-sizing:border-box}
.fld textarea{min-height:88px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:1px}

/* ---- VISUALIZATION STUDIO ---- */
.viz-types{flex-wrap:wrap}
.viz-preview{margin:10px 0;padding:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;overflow-x:auto}
.viz-preview svg{max-width:100%;height:auto}

/* ---- BODY MAP ----
   Three states that must never look alike: loaded (filled, opacity by share), none in the window (outline
   only — a measured zero), and no record (hatched — a gap). */
.bm-wrap{max-width:360px;margin:8px auto;color:var(--text-2)}
.bodymap{width:100%;height:auto;display:block}
.bm-sil *{fill:var(--surface-2);stroke:var(--border-strong);stroke-width:1}
.bm-r{stroke-width:1.2}
.bm-load{fill:var(--accent);stroke:var(--accent)}
.bm-none{fill:none;stroke:var(--text-2);stroke-dasharray:2 2}
.bm-gap{stroke:var(--text-3)}
.bm-cap{font-size:9px;fill:var(--text-2);font-family:var(--mono)}
.bm-key{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:calc(11px*var(--ts));color:var(--text-2);margin:4px 0 8px}
.bm-k{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.bm-k-load{background:var(--accent)}
.bm-k-none{border:1px dashed var(--text-2)}
.bm-k-gap{background:repeating-linear-gradient(45deg,var(--text-3) 0 1px,transparent 1px 4px)}

/* ---- MOVEMENT / MOBILITY ---- layers styled independently, so each can change without the others */
.sk-wrap{max-width:320px;margin:8px auto}
.skeleton{width:100%;height:auto;display:block}
.sk-seg{stroke:var(--text);stroke-width:3;stroke-linecap:round}
.sk-seg.sk-ghost{stroke:var(--text-3);stroke-width:2;stroke-dasharray:3 3}
.sk-head{fill:none;stroke:var(--text);stroke-width:2}.sk-head.sk-ghost{stroke:var(--text-3);stroke-dasharray:3 3}
.sk-joint{fill:var(--surface-2);stroke:var(--text-2);stroke-width:1.2}
.sk-hot{fill:var(--accent);stroke:var(--accent)}
.sk-rom{fill:none;stroke:var(--attention);stroke-width:2}
.sk-force,.sk-force-head{stroke:var(--negative);stroke-width:2;fill:none}
.sk-label{font-size:10px;fill:var(--text-2);font-family:var(--mono)}
.mv-pick{flex-wrap:wrap}
.sk-key,.pg-key,.nu-key{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:calc(11px*var(--ts));color:var(--text-2);margin:6px 0}
.sk-k{display:inline-block;width:16px;height:3px;margin-right:4px;vertical-align:middle}
.sk-k-ghost{border-top:2px dashed var(--text-3);height:0}.sk-k-end{background:var(--text)}
.sk-k-hot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.sk-k-force{background:var(--negative)}
/* ---- PROGRAM ---- */
.pg-cal{display:grid;gap:4px;margin:6px 0}
.pg-row{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));gap:4px;align-items:center}
.pg-head span{font-size:calc(10px*var(--ts));color:var(--text-2);text-align:center}
.pg-wk{font-size:calc(10px*var(--ts));color:var(--text-2);font-family:var(--mono)}
.pg-cell{display:flex;align-items:center;justify-content:center;min-height:30px;border-radius:7px;
  font-size:calc(11px*var(--ts));font-family:var(--mono);border:1px solid var(--border)}
.pg-done{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pg-done-other-day{background:var(--surface-2);border-color:var(--accent);color:var(--text)}
.pg-not-on-this-day{border-style:dashed;color:var(--text-2)}
.pg-upcoming{border-style:dotted;color:var(--text-3)}
.pg-rest,.pg-rest-or-other{color:var(--text-3)}
.pg-key .pg-cell{min-height:22px;width:24px;display:inline-flex}
/* ---- NUTRITION ---- a gap is labelled, never an empty bar that reads as zero */
.nu-row{display:grid;grid-template-columns:44px minmax(0,1fr) 46px;gap:8px;align-items:center;margin:3px 0}
.nu-d,.nu-k{font-size:calc(11px*var(--ts));color:var(--text-2);font-family:var(--mono)}
.nu-k{text-align:right}
.nu-bar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.nu-p{background:var(--accent)}.nu-c{background:var(--neutral)}.nu-f{background:var(--attention)}
.nu-key span{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.nu-gap,.nu-partial{font-size:calc(11px*var(--ts));color:var(--text-3);font-style:italic}

/* ---- ADVANCED CHARTS ---- an empty heatmap cell is visibly different from a low value */
.hm-cell{fill:var(--accent)}
.hm-gap{fill:none;stroke:var(--border-strong);stroke-dasharray:2 2}
.hm-lab,.bp-thin{font-size:9px;fill:var(--text-2);font-family:var(--mono)}
.bp-box{fill:var(--surface-2);stroke:var(--accent);stroke-width:1.5}
.bp-median{stroke:var(--accent);stroke-width:2.5}
.bp-whisker{stroke:var(--text-2);stroke-width:1}
.hb-bar{fill:var(--accent)}

/* ---- RAIL-SAFE CHARTS ---- charts never sit under a floating rail (see applyRailInsets) */
.card svg.chart,.card svg.chart-svg,.card .viz-preview svg,.card .bm-svg,.card .sk-svg{
  margin-left:var(--rail-inset-l,0px);margin-right:var(--rail-inset-r,0px);
  width:calc(100% - var(--rail-inset-l,0px) - var(--rail-inset-r,0px));max-width:calc(100% - var(--rail-inset-l,0px) - var(--rail-inset-r,0px))}

/* Rails can be hidden; the chart insets then measure zero and charts use the full width. */
:root[data-rails="off"] #railLeft,:root[data-rails="off"] #railRight{display:none}

/* ---- PROGRESS PHOTOS ---- */
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px;margin-top:6px}
.photo-cell{margin:0;border:1px solid var(--border);border-radius:var(--radius-sm,8px);overflow:hidden;background:var(--surface-2)}
.photo-cell img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--surface-2)}
.photo-cell figcaption{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 8px;font-size:calc(12px*var(--ts,1));color:var(--text-2)}
.photo-cell figcaption .btn{margin-left:auto}

/* ---- DETAIL LEVEL ---- one setting controls how much every page and panel shows */
/* Top-level sections follow their own classification (applyPanelLevels); only a fold NESTED inside another panel —
   genuinely "more detail" — is hidden in Casual. Hiding every fold hid casual sections such as favourites and recipes. */
:root[data-detail="casual"] .prov,:root[data-detail="casual"] .cls-mark,:root[data-detail="casual"] .m-prov .cls,:root[data-detail="casual"] .cls,:root[data-detail="casual"] .card details.fold,:root[data-detail="casual"] details.fold details.fold,
:root[data-detail="casual"] .lvl-insight,:root[data-detail="casual"] [data-level="insightful"],
:root[data-detail="casual"] .tab[data-tab="diagnose"],:root[data-detail="casual"] .tab[data-tab="experiments"],
:root[data-detail="casual"] .tab[data-tab="learn"],:root[data-detail="casual"] .tab[data-tab="archive"]{display:none!important}
:root[data-detail="casual"] .dev,:root[data-detail="casual"] [data-level="developer"],
:root[data-detail="insightful"] .dev,:root[data-detail="insightful"] [data-level="developer"]{display:none!important}
:root[data-detail="developer"] .dev{display:block;margin-top:6px;font-family:var(--mono);font-size:calc(11px*var(--ts,1));color:var(--text-3);word-break:break-all}
.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;border:1px solid var(--border-strong)}

/* ---- TEXT CARD ---- each face shown in itself */
.face-list{display:grid;gap:8px;margin:4px 0 10px}
.face-btn{display:grid;gap:2px;text-align:left;padding:10px 12px;min-height:44px;border:1px solid var(--border);border-radius:var(--radius-sm,8px);background:var(--surface-2);color:var(--text);cursor:pointer}
.face-btn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.face-name{font-weight:700;font-size:calc(15px*var(--ts,1))}
.face-sample{font-size:calc(14px*var(--ts,1));color:var(--text-2)}
.face-note{font-size:calc(12px*var(--ts,1));color:var(--text-2)}

/* ---- COLOUR PICKERS ---- */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,96px),1fr));gap:8px;margin:4px 0}
.theme-btn{display:grid;gap:6px;justify-items:center;padding:8px;min-height:44px;border:1px solid var(--border);border-radius:var(--radius-sm,8px);background:var(--surface-2);color:var(--text);cursor:pointer;font-size:calc(13px*var(--ts,1))}
.theme-btn.active,.swatch-btn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.theme-mini{display:block;width:72px;height:48px;border-radius:6px;padding:8px;border:1px solid var(--border-strong)}
.theme-mini-card{display:grid;gap:4px;height:100%;border-radius:4px;padding:5px;position:relative}
.theme-mini-card span{display:block;height:3px;border-radius:2px;width:70%}
.theme-mini-card i{position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-radius:50%}
.swatch-row{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 8px}
.swatch-btn{display:grid;justify-items:center;gap:4px;min-width:64px;min-height:44px;padding:6px;border:1px solid var(--border);border-radius:var(--radius-sm,8px);background:var(--surface-2);color:var(--text-2);cursor:pointer;font-size:calc(12px*var(--ts,1))}
.swatch-dot{display:block;width:28px;height:28px;border-radius:50%}
.slider input[type=range]{width:100%;min-height:44px}

.hue-slider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong)}
.hue-slider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--surface)}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;background:none;border:0;color:var(--text);cursor:pointer;padding:0;font-size:calc(14px*var(--ts,1))}
.toggle-track{position:relative;width:46px;height:26px;border-radius:999px;background:var(--surface-3,var(--border-strong));transition:background .15s}
.toggle-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform .15s}
.toggle.on .toggle-track{background:var(--accent)}

/* Hints were styled only inside .form-row; the other ~90 rendered as full-size body text, as loud as the content they
